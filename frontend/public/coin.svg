<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Luxury Gold Gradient -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCE181" />
            <stop offset="30%" stop-color="#D4AF37" />
            <stop offset="70%" stop-color="#B8860B" />
            <stop offset="100%" stop-color="#8A640F" />
        </linearGradient>
        
        <!-- Shiny Inner Gold Gradient (replaces Green) -->
        <linearGradient id="goldCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFEAA5" />
            <stop offset="50%" stop-color="#D4AF37" />
            <stop offset="100%" stop-color="#A27D18" />
        </linearGradient>
        
        <!-- Subtle shadow for emblem depth -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
        </filter>
    </defs>
    
    <!-- Outer Gold Ring Border -->
    <circle cx="256" cy="256" r="236" fill="url(#goldGrad)" />
    
    <!-- Outer Ring Ridges (Coin ridges pattern) -->
    <circle cx="256" cy="256" r="226" stroke="#5C430A" stroke-width="6" stroke-dasharray="14 10" opacity="0.4" />
    
    <!-- Inner Gold Core (replaces Green enamel) -->
    <circle cx="256" cy="256" r="206" fill="url(#goldCoreGrad)" stroke="url(#goldGrad)" stroke-width="4" />
    
    <!-- Inner Gold Ridge Circle -->
    <circle cx="256" cy="256" r="192" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.7" />
    
    <!-- Center Emblem Group with soft drop shadow -->
    <g filter="url(#shadow)">
        <!-- Gold Campuna Tent -->
        <path d="M226 176 L134 322 H182 L226 250 L270 322 H318 Z" fill="url(#goldGrad)" />
        
        <!-- Gold Tree Trunk -->
        <rect x="345" y="292" width="14" height="30" rx="3" fill="url(#goldGrad)" />
        
        <!-- Gold Two-Tiered Pine Tree Leaves -->
        <path d="M352 176 L312 236 H330 L302 296 H402 L374 236 H392 Z" fill="url(#goldGrad)" />
    </g>
</svg>
